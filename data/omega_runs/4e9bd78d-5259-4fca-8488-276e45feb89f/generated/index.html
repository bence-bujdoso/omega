<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>omega-project — Acropolis of Athens</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d14; font-family: system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #ui {
    position: fixed; left: 14px; top: 14px; z-index: 10;
    background: rgba(12,14,22,0.72); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 14px 16px; color: #eef2ff; width: 232px; user-select: none;
  }
  #ui h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .06em; text-transform: uppercase; color: #ffd9a0; }
  #ui label { display: block; font-size: 11px; margin: 10px 0 3px; color: #c7d2fe; }
  #ui input[type=range] { width: 100%; accent-color: #ffb347; }
  .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .btn {
    flex: 1 1 auto; font-size: 11px; padding: 6px 8px; border-radius: 8px; cursor: pointer;
    background: #1a1d2b; color: #dbeafe; border: 1px solid #2a2e43;
  }
  .btn.active { background: #ffb347; color: #1a1206; border-color: #ffb347; }
  .chk { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 11px; color: #c7d2fe; }
  #hud { position: fixed; right: 12px; bottom: 10px; z-index: 10; color: #a5b4fc; font-size: 11px; font-family: monospace; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #fecaca; background: #1a0b0b; padding: 24px; font-family: monospace; white-space: pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <h1>omega-project</h1>
  <label>Time of day</label>
  <input id="timeSlider" type="range" min="0" max="1" step="0.001" value="0.32" />
  <label>Haze</label>
  <input id="hazeSlider" type="range" min="0" max="1" step="0.01" value="0.3" />
  <div class="chk"><input id="crowdToggle" type="checkbox" checked /> Show crowd</div>
  <label>Crowd density</label>
  <input id="crowdSlider" type="range" min="0" max="1" step="0.01" value="0.5" />
  <div class="row">
    <button class="btn active" data-cam="postcard">Postcard</button>
    <button class="btn" data-cam="inspect">Inspect</button>
    <button class="btn" data-cam="flyover">Flyover</button>
  </div>
</div>
<div id="hud"></div>
<div id="err"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const errorPanel = document.getElementById("err");
function showError(message) {
  errorPanel.style.display = "grid";
  errorPanel.textContent = "Scene error:\n" + message;
}

try {
  const appRoot = document.getElementById("app");

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  appRoot.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const skyColor = new THREE.Color(0x9ec9ff);
  scene.background = skyColor;
  scene.fog = new THREE.FogExp2(0xbcd3ea, 0.006);

  const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 4000);
  camera.position.set(120, 78, 150);

  const orbit = new OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true;
  orbit.target.set(0, 22, 0);
  orbit.maxPolarAngle = Math.PI * 0.495;

  // ---- Lighting ----
  const hemiLight = new THREE.HemisphereLight(0xbfd8ff, 0x6b5a44, 0.9);
  scene.add(hemiLight);

  const sunLight = new THREE.DirectionalLight(0xfff2d6, 2.0);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.near = 1;
  sunLight.shadow.camera.far = 900;
  sunLight.shadow.camera.left = -260;
  sunLight.shadow.camera.right = 260;
  sunLight.shadow.camera.top = 260;
  sunLight.shadow.camera.bottom = -260;
  scene.add(sunLight);
  scene.add(sunLight.target);

  // ---- Materials ----
  const marbleMaterial = new THREE.MeshStandardMaterial({ color: 0xf3ead6, roughness: 0.72, metalness: 0.02 });
  const rockMaterial = new THREE.MeshStandardMaterial({ color: 0xbfae91, roughness: 0.96 });
  const groundMaterial = new THREE.MeshStandardMaterial({ color: 0xa79463, roughness: 1.0 });

  // ---- Acropolis rock plateau ----
  const terrain = new THREE.Mesh(new THREE.CircleGeometry(1400, 48), groundMaterial);
  terrain.rotation.x = -Math.PI / 2;
  terrain.position.y = -4;
  terrain.receiveShadow = true;
  scene.add(terrain);

  const hill = new THREE.Mesh(new THREE.CylinderGeometry(190, 240, 46, 40, 1), rockMaterial);
  hill.position.y = -23;
  hill.castShadow = true;
  hill.receiveShadow = true;
  scene.add(hill);

  // carved approach steps on the hill
  for (let stepIndex = 0; stepIndex < 8; stepIndex++) {
    const stair = new THREE.Mesh(new THREE.BoxGeometry(40, 3, 9), rockMaterial);
    stair.position.set(0, -2 - stepIndex * 3, 150 - stepIndex * 9);
    stair.castShadow = true;
    stair.receiveShadow = true;
    scene.add(stair);
  }

  // ---- Parthenon ----
  const temple = new THREE.Group();
  scene.add(temple);

  const templeWidth = 90;   // long side (x)
  const templeDepth = 42;   // short side (z)
  const columnHeight = 34;
  const columnRadius = 3.0;

  // stepped stylobate (crepidoma)
  const stepSizes = [
    [templeWidth + 20, 4, templeDepth + 20],
    [templeWidth + 12, 4, templeDepth + 12],
    [templeWidth + 4, 4, templeDepth + 4],
  ];
  let baseTop = 0;
  stepSizes.forEach((size, stepIndex) => {
    const step = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), marbleMaterial);
    step.position.y = 2 + stepIndex * 4;
    step.castShadow = true;
    step.receiveShadow = true;
    temple.add(step);
    baseTop = step.position.y + 2;
  });

  // column instances around the peristyle
  const columnsPerLongSide = 8;
  const columnsPerShortSide = 15;
  const columnPositions = [];
  const halfWidth = templeWidth / 2;
  const halfDepth = templeDepth / 2;
  for (let index = 0; index < columnsPerLongSide; index++) {
    const t = index / (columnsPerLongSide - 1);
    const px = -halfWidth + t * templeWidth;
    columnPositions.push([px, halfDepth]);
    columnPositions.push([px, -halfDepth]);
  }
  for (let index = 1; index < columnsPerShortSide - 1; index++) {
    const t = index / (columnsPerShortSide - 1);
    const pz = -halfDepth + t * templeDepth;
    columnPositions.push([halfWidth, pz]);
    columnPositions.push([-halfWidth, pz]);
  }

  const columnGeometry = new THREE.CylinderGeometry(columnRadius * 0.82, columnRadius, columnHeight, 18, 1);
  const columnMesh = new THREE.InstancedMesh(columnGeometry, marbleMaterial, columnPositions.length);
  columnMesh.castShadow = true;
  columnMesh.receiveShadow = true;
  const columnMatrix = new THREE.Matrix4();
  columnPositions.forEach((pos, index) => {
    columnMatrix.makeTranslation(pos[0], baseTop + columnHeight / 2, pos[1]);
    columnMesh.setMatrixAt(index, columnMatrix);
  });
  columnMesh.instanceMatrix.needsUpdate = true;
  temple.add(columnMesh);

  // capitals (simple abacus blocks) reuse instancing
  const capitalGeometry = new THREE.BoxGeometry(columnRadius * 2.4, 2.2, columnRadius * 2.4);
  const capitalMesh = new THREE.InstancedMesh(capitalGeometry, marbleMaterial, columnPositions.length);
  capitalMesh.castShadow = true;
  columnPositions.forEach((pos, index) => {
    columnMatrix.makeTranslation(pos[0], baseTop + columnHeight + 1, pos[1]);
    capitalMesh.setMatrixAt(index, columnMatrix);
  });
  capitalMesh.instanceMatrix.needsUpdate = true;
  temple.add(capitalMesh);

  // entablature (architrave beam)
  const entablature = new THREE.Mesh(
    new THREE.BoxGeometry(templeWidth + 12, 8, templeDepth + 12), marbleMaterial);
  entablature.position.y = baseTop + columnHeight + 6;
  entablature.castShadow = true;
  temple.add(entablature);

  // cella (inner walls)
  const cella = new THREE.Mesh(
    new THREE.BoxGeometry(templeWidth - 20, columnHeight - 4, templeDepth - 18), marbleMaterial);
  cella.position.y = baseTop + (columnHeight - 4) / 2;
  cella.castShadow = true;
  cella.receiveShadow = true;
  temple.add(cella);

  // pediments (triangular gables) on the short faces
  const pedimentShape = new THREE.Shape();
  pedimentShape.moveTo(-(templeDepth + 12) / 2, 0);
  pedimentShape.lineTo((templeDepth + 12) / 2, 0);
  pedimentShape.lineTo(0, 12);
  pedimentShape.lineTo(-(templeDepth + 12) / 2, 0);
  const pedimentGeometry = new THREE.ExtrudeGeometry(pedimentShape, { depth: 4, bevelEnabled: false });
  const pedimentTop = baseTop + columnHeight + 10;
  [1, -1].forEach((side) => {
    const pediment = new THREE.Mesh(pedimentGeometry, marbleMaterial);
    pediment.rotation.y = side > 0 ? 0 : Math.PI;
    pediment.position.set(0, pedimentTop, side * ((templeWidth + 12) / 2 - 2));
    pediment.rotation.z = 0;
    pediment.rotation.x = 0;
    pediment.rotation.order = "YXZ";
    pediment.rotation.y = Math.PI / 2 * side;
    pediment.castShadow = true;
    temple.add(pediment);
  });

  // gable roof
  const roof = new THREE.Mesh(new THREE.BoxGeometry(templeWidth + 6, 3, templeDepth + 14), marbleMaterial);
  roof.position.y = pedimentTop + 12;
  roof.castShadow = true;
  temple.add(roof);

  temple.position.y = 2;

  // ---- Instanced olive trees ----
  const trunkGeometry = new THREE.CylinderGeometry(0.8, 1.1, 7, 6);
  const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x5b4632, roughness: 1 });
  const foliageGeometry = new THREE.IcosahedronGeometry(5, 0);
  const foliageMaterial = new THREE.MeshStandardMaterial({ color: 0x7c8f5a, roughness: 0.9, flatShading: true });

  const treeCount = 70;
  const trunkMesh = new THREE.InstancedMesh(trunkGeometry, trunkMaterial, treeCount);
  const foliageMesh = new THREE.InstancedMesh(foliageGeometry, foliageMaterial, treeCount);
  trunkMesh.castShadow = true;
  foliageMesh.castShadow = true;
  const treeMatrix = new THREE.Matrix4();
  const treeScale = new THREE.Vector3();
  const treeQuat = new THREE.Quaternion();
  const treePos = new THREE.Vector3();
  for (let index = 0; index < treeCount; index++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 210 + Math.random() * 520;
    const px = Math.cos(angle) * radius;
    const pz = Math.sin(angle) * radius;
    const scale = 0.8 + Math.random() * 1.4;
    treePos.set(px, -1, pz);
    treeScale.set(scale, scale, scale);
    treeMatrix.compose(treePos, treeQuat, treeScale);
    trunkMesh.setMatrixAt(index, treeMatrix);
    treePos.set(px, 6 * scale, pz);
    treeMatrix.compose(treePos, treeQuat, treeScale);
    foliageMesh.setMatrixAt(index, treeMatrix);
  }
  trunkMesh.instanceMatrix.needsUpdate = true;
  foliageMesh.instanceMatrix.needsUpdate = true;
  scene.add(trunkMesh);
  scene.add(foliageMesh);

  // ---- Distant city massing ----
  const cityMaterial = new THREE.MeshStandardMaterial({ color: 0xc9bfa6, roughness: 1 });
  const cityGeometry = new THREE.BoxGeometry(1, 1, 1);
  const cityCount = 160;
  const cityMesh = new THREE.InstancedMesh(cityGeometry, cityMaterial, cityCount);
  const cityMatrix = new THREE.Matrix4();
  const cityScale = new THREE.Vector3();
  const cityPos = new THREE.Vector3();
  const cityQuat = new THREE.Quaternion();
  for (let index = 0; index < cityCount; index++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 700 + Math.random() * 620;
    const height = 6 + Math.random() * 22;
    cityPos.set(Math.cos(angle) * radius, -20 + height / 2, Math.sin(angle) * radius);
    cityScale.set(8 + Math.random() * 14, height, 8 + Math.random() * 14);
    cityMatrix.compose(cityPos, cityQuat, cityScale);
    cityMesh.setMatrixAt(index, cityMatrix);
  }
  cityMesh.instanceMatrix.needsUpdate = true;
  scene.add(cityMesh);

  // ---- Instanced people (robed figures) ----
  const personGeometry = new THREE.CylinderGeometry(1.1, 1.7, 6, 6);
  const personMaterial = new THREE.MeshStandardMaterial({ color: 0xe8e2d0, roughness: 0.95 });
  const maxPeople = 120;
  const personMesh = new THREE.InstancedMesh(personGeometry, personMaterial, maxPeople);
  personMesh.castShadow = true;
  const personMatrix = new THREE.Matrix4();
  const personPositions = [];
  for (let index = 0; index < maxPeople; index++) {
    const onPlateau = Math.random() < 0.6;
    const radius = onPlateau ? Math.random() * 150 : 200 + Math.random() * 220;
    const angle = Math.random() * Math.PI * 2;
    personPositions.push(new THREE.Vector3(Math.cos(angle) * radius, 6, Math.sin(angle) * radius));
  }
  function updateCrowd(visibleFraction, enabled) {
    const visibleCount = enabled ? Math.floor(maxPeople * visibleFraction) : 0;
    personMesh.count = visibleCount;
    for (let index = 0; index < visibleCount; index++) {
      personMatrix.makeTranslation(personPositions[index].x, personPositions[index].y, personPositions[index].z);
      personMesh.setMatrixAt(index, personMatrix);
    }
    personMesh.instanceMatrix.needsUpdate = true;
  }
  scene.add(personMesh);

  // ---- Time of day ----
  const morningColor = new THREE.Color(0xffb27a);
  const noonColor = new THREE.Color(0xfff6e0);
  const goldenColor = new THREE.Color(0xff9d5c);
  const morningSky = new THREE.Color(0x8fb3e8);
  const noonSky = new THREE.Color(0x9ec9ff);
  const goldenSky = new THREE.Color(0xd8a487);
  const sunColor = new THREE.Color();
  const currentSky = new THREE.Color();

  function applyTimeOfDay(value) {
    // value 0 = morning, 0.5 = high noon, 1 = golden hour
    const elevation = Math.sin(Math.min(value, 0.5) / 0.5 * Math.PI * 0.5) * (value <= 0.5 ? 1 : 1)
      - (value > 0.5 ? (value - 0.5) / 0.5 * 0.6 : 0);
    const clampedElevation = Math.max(0.12, elevation);
    const azimuth = -0.6 + value * 2.2;
    const sunDistance = 300;
    sunLight.position.set(
      Math.cos(azimuth) * sunDistance,
      clampedElevation * 260 + 30,
      Math.sin(azimuth) * sunDistance * 0.4
    );
    sunLight.target.position.set(0, 10, 0);

    if (value <= 0.5) {
      sunColor.copy(morningColor).lerp(noonColor, value / 0.5);
      currentSky.copy(morningSky).lerp(noonSky, value / 0.5);
    } else {
      sunColor.copy(noonColor).lerp(goldenColor, (value - 0.5) / 0.5);
      currentSky.copy(noonSky).lerp(goldenSky, (value - 0.5) / 0.5);
    }
    sunLight.color.copy(sunColor);
    sunLight.intensity = 1.4 + clampedElevation * 1.2;
    hemiLight.intensity = 0.5 + clampedElevation * 0.7;
    scene.background = currentSky;
    scene.fog.color.copy(currentSky).lerp(new THREE.Color(0xffffff), 0.25);
    // softer shadows near golden hour / low sun
    sunLight.shadow.radius = 2 + (1 - clampedElevation) * 8;
  }

  // ---- UI wiring ----
  const timeSlider = document.getElementById("timeSlider");
  const hazeSlider = document.getElementById("hazeSlider");
  const crowdToggle = document.getElementById("crowdToggle");
  const crowdSlider = document.getElementById("crowdSlider");
  const hud = document.getElementById("hud");

  timeSlider.addEventListener("input", () => applyTimeOfDay(parseFloat(timeSlider.value)));
  hazeSlider.addEventListener("input", () => {
    scene.fog.density = 0.0015 + parseFloat(hazeSlider.value) * 0.02;
  });
  function refreshCrowd() {
    updateCrowd(parseFloat(crowdSlider.value), crowdToggle.checked);
  }
  crowdToggle.addEventListener("change", refreshCrowd);
  crowdSlider.addEventListener("input", refreshCrowd);

  // ---- Camera modes ----
  let cameraMode = "postcard";
  let flyoverTime = 0;
  const cameraButtons = document.querySelectorAll(".btn");
  cameraButtons.forEach((button) => {
    button.addEventListener("click", () => {
      cameraButtons.forEach((other) => other.classList.remove("active"));
      button.classList.add("active");
      cameraMode = button.getAttribute("data-cam");
      if (cameraMode === "postcard") {
        orbit.enabled = true;
        camera.position.set(120, 78, 150);
        orbit.target.set(0, 22, 0);
      } else if (cameraMode === "inspect") {
        orbit.enabled = true;
        camera.position.set(60, 34, 70);
        orbit.target.set(0, 26, 0);
      } else {
        orbit.enabled = false;
        flyoverTime = 0;
      }
    });
  });

  // ---- Resize ----
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  });

  // ---- Init ----
  applyTimeOfDay(parseFloat(timeSlider.value));
  scene.fog.density = 0.0015 + parseFloat(hazeSlider.value) * 0.02;
  refreshCrowd();

  // ---- FPS meter + loop ----
  let frameCount = 0;
  let lastFpsTime = performance.now();
  let fps = 0;
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (cameraMode === "flyover") {
      flyoverTime += delta * 0.12;
      const radius = 190;
      camera.position.set(
        Math.cos(flyoverTime) * radius,
        70 + Math.sin(flyoverTime * 0.6) * 26,
        Math.sin(flyoverTime) * radius
      );
      camera.lookAt(0, 26, 0);
    } else {
      orbit.update();
    }

    renderer.render(scene, camera);

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime >= 500) {
      fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
      frameCount = 0;
      lastFpsTime = now;
      hud.textContent = "Acropolis · " + fps + " FPS · " + cameraMode;
    }
  }
  animate();
} catch (sceneException) {
  showError(sceneException && sceneException.stack ? sceneException.stack : String(sceneException));
}
</script>
</body>
</html>
